<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV — G. C. Capellini</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Raleway:wght@300;400&display=swap');

  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
.img-credit {
  position: fixed;
  bottom: 8px;
  right: 16px;
  font-family: 'Raleway', sans-serif;
  font-size: 9px;
  letter-spacing: 0.1em;
  color: rgba(245,240,232,0.30);
  z-index: 5;
}
.img-credit a {
  color: rgba(245,240,232,0.30);
  text-decoration: none;
  border-bottom: 1px solid rgba(245,240,232,0.15);
  transition: color 0.3s;
}
.img-credit a:hover { color: #ff8c2a; }
  body {
    min-height: 100vh;
    background: url("1.jpg") center/cover no-repeat fixed;
    font-family: 'EB Garamond', Georgia, serif;
    color: #f5f0e8;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(
      115deg,
      rgba(0,0,0,0.93) 0%,
      rgba(0,0,0,0.82) 45%,
      rgba(0,0,0,0.55) 100%
    );
    z-index: 0;
  }

  .site-wrapper { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }

  /* ── Navbar ── */
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 32px 64px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .logo {
    font-family: 'EB Garamond', serif;
    font-size: 22px;
    font-weight: 400;
    letter-spacing: 0.12em;
    color: #ff8c2a;
    text-decoration: none;
  }
  .nav-links { display: flex; gap: 48px; list-style: none; }
  .nav-links a {
    font-family: 'Raleway', sans-serif;
    font-size: 12px;
    font-weight: 300;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(245,240,232,0.90);
    text-decoration: none;
    transition: color 0.3s;
  }
  .nav-links a:hover, .nav-links a.active { color: #ff8c2a; }

  /* ── Centered content ── */
  .coming-soon {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 64px;
    opacity: 0;
    animation: fadeUp 1.1s ease forwards 0.2s;
  }

  .coming-label {
    font-family: 'Raleway', sans-serif;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #ff8c2a;
    margin-bottom: 32px;
  }

  .coming-title {
    font-family: 'EB Garamond', serif;
    font-size: clamp(52px, 7vw, 96px);
    font-weight: 400;
    line-height: 1.05;
    color: #fff;
    margin-bottom: 32px;
    text-shadow: 0 2px 24px rgba(0,0,0,0.8);
  }
  .coming-title em {
    font-style: italic;
    color: rgba(255,255,255,0.55);
  }

  .coming-desc {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-weight: 300;
    line-height: 1.7;
    color: rgba(245,240,232,0.70);
    max-width: 420px;
    margin-bottom: 48px;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: rgba(255,140,42,0.5);
    margin: 0 auto 48px;
  }

  .back-link {
    font-family: 'Raleway', sans-serif;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #f5f0e8;
    text-decoration: none;
    border-bottom: 1px solid rgba(245,240,232,0.35);
    padding-bottom: 2px;
    transition: color 0.3s, border-color 0.3s;
  }
  .back-link:hover { color: #ff8c2a; border-color: #ff8c2a; }

  /* Bottom bar */
  .bottom-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #ff8c2a 0%, transparent 100%);
    z-index: 10;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="site-wrapper">

  <nav>
    <a class="logo" href="index.html">G. C. Capellini</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="research.html">Research</a></li>
      <li><a href="software.html">Software</a></li>
      <li><a href="cv.html" class="active">CV</a></li>
    </ul>
  </nav>

  <div class="coming-soon">
    <p class="coming-label">Curriculum Vitæ</p>
    <h1 class="coming-title">Coming<br><em>Soon</em></h1>
    <div class="divider"></div>
    <p class="coming-desc">
      The CV will be available here shortly.<br>
      In the meantime, feel free to get in touch.
    </p>
    <a class="back-link" href="https://www.iag.usp.br/astronomia/membros/mestrandos" >Contact me</a>
  </div>

</div>
<div class="bottom-bar"></div>

<footer class="img-credit">
  Background: <a href="https://esawebb.org/images/weic2417a/" target="_blank">ESA/Webb</a>
  — Credit: NASA, ESA, CSA, STScI, T. Temim (Princeton University)
</footer>

</body>
</html>
