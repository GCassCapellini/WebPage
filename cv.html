<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV — G. C. Capellini</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Raleway:wght@300;400&display=swap');

  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  .img-credit {
    position: fixed;
    bottom: 8px;
    right: 16px;
    font-family: 'Raleway', sans-serif;
    font-size: 9px;
    letter-spacing: 0.1em;
    color: rgba(245,240,232,0.30);
    z-index: 5;
  }

  .img-credit a {
    color: rgba(245,240,232,0.30);
    text-decoration: none;
    border-bottom: 1px solid rgba(245,240,232,0.15);
    transition: color 0.3s;
  }

  .img-credit a:hover { color: #ff8c2a; }

  body {
    min-height: 100vh;
    background: url("1.jpg") center/cover no-repeat fixed;
    font-family: 'EB Garamond', Georgia, serif;
    color: #f5f0e8;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(
      115deg,
      rgba(0,0,0,0.93) 0%,
      rgba(0,0,0,0.82) 45%,
      rgba(0,0,0,0.55) 100%
    );
    z-index: 0;
  }

  .site-wrapper {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 32px 64px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .logo {
    font-family: 'EB Garamond', serif;
    font-size: 22px;
    letter-spacing: 0.12em;
    color: #ff8c2a;
    text-decoration: none;
  }

  .nav-links {
    display: flex;
    gap: 48px;
    list-style: none;
  }

  .nav-links a {
    font-family: 'Raleway', sans-serif;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(245,240,232,0.90);
    text-decoration: none;
    transition: color 0.3s;
  }

  .nav-links a:hover,
  .nav-links a.active {
    color: #ff8c2a;
  }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 64px 32px;
    animation: fadeUp 1.1s ease forwards;
  }

  .coming-label {
    font-family: 'Raleway', sans-serif;
    font-size: 11px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #ff8c2a;
    margin-bottom: 24px;
  }

  .coming-title {
    font-size: clamp(48px, 6vw, 80px);
    margin-bottom: 24px;
  }

  .coming-title em {
    font-style: italic;
    color: rgba(255,255,255,0.55);
  }

  .coming-desc {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    line-height: 1.7;
    color: rgba(245,240,232,0.75);
    max-width: 500px;
    margin-bottom: 40px;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: rgba(255,140,42,0.5);
    margin: 0 auto 40px;
  }

  .back-link {
    font-family: 'Raleway', sans-serif;
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #f5f0e8;
    text-decoration: none;
    border-bottom: 1px solid rgba(245,240,232,0.35);
    padding-bottom: 2px;
    transition: 0.3s;
  }

  .back-link:hover {
    color: #ff8c2a;
    border-color: #ff8c2a;
  }

  .pdf-container {
    margin-top: 48px;
    width: 100%;
    max-width: 900px;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
  }

  iframe {
    width: 100%;
    height: 600px;
    border: none;
    opacity: 0.95;
  }

  .bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, #ff8c2a 0%, transparent 100%);
    z-index: 10;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>

<body>
<div class="site-wrapper">

  <nav>
    <a class="logo" href="index.html">G. C. Capellini</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="research.html">Research</a></li>
      <li><a href="software.html">Software</a></li>
      <li><a href="cv.html" class="active">CV</a></li>
    </ul>
  </nav>

  <div class="content">
    <p class="coming-label">Curriculum Vitæ</p>
    <h1 class="coming-title">Curriculum<br><em>Vitæ</em></h1>
    <div class="divider"></div>

    <p class="coming-desc">
      A detailed overview of my academic background, research experience, and publications.
    </p>

    <a class="back-link" href="CV_Gabriel_Capellini.pdf" target="_blank">
      Download CV (PDF)
    </a>

    <div class="pdf-container">
      <iframe src="CV_Gabriel_Capellini.pdf"></iframe>
    </div>
  </div>

</div>

<div class="bottom-bar"></div>

<footer class="img-credit">
  Background: <a href="https://esawebb.org/images/weic2417a/" target="_blank">ESA/Webb</a>
  — Credit: NASA, ESA, CSA, STScI, T. Temim (Princeton University)
</footer>

</body>
</html>
